<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>휴먼 검수</title>
<style>body{margin:0;background:#f3f5f8;color:#18283b;font:16px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:28px}h1{margin:8px 0}a{color:#245bd5}button,select{font:inherit;padding:9px 14px;border:1px solid #bdc8d6;border-radius:8px;background:white;cursor:pointer}.panel,.card{background:white;border:1px solid #dbe2eb;border-radius:12px;padding:22px;margin:16px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{margin:0;display:flex;flex-direction:column;gap:12px}.card h2,.card p{margin:0}.badge{display:inline-block;background:#fff0bd;border-radius:7px;padding:4px 10px}.approved{background:#d1f3dd}.held{background:#ffe0d9}.button{display:inline-block;padding:10px 16px;background:#245bd5;color:white;border-radius:8px;text-decoration:none;align-self:flex-start}.muted{color:#59697a}.error{color:#a62323}#message{white-space:pre-wrap}@media(max-width:800px){.cards{grid-template-columns:1fr}}</style>
<main><a href="/">← Airflow 진행 상태</a><h1>휴먼 검수</h1><p>계산과 실행 이력은 Airflow에서, 결과 확인과 승인·보류는 여기에서 관리합니다. 승인 기록을 Airflow가 확인한 뒤 자동으로 다음 단계를 진행합니다.</p>
<div class="panel row"><label>파이프라인 <select id="dag"><option>kaist_revising_gpu_4090_a</option></select></label><button id="refresh">새로고침</button><label><input type="checkbox" id="done"> 승인 완료도 표시</label><span class="muted">20초마다 자동 갱신</span></div>
<p id="message">검수 상태를 확인 중입니다…</p><div id="cards" class="cards"></div>
<div class="panel"><b>검수 순서</b><p>마스크 승인 → 추적 실행 → 추적 승인 → 천 3D 복원·MANO</p><a href="/kaist-review/?view=mask">마스크 검수 직접 열기</a> · <a href="/kaist-review/?view=tracking">추적 검수 직접 열기</a></div></main>
<script>
const q=s=>document.querySelector(s),params=new URLSearchParams(location.search);if(params.get('dag_id'))q('#dag').value=params.get('dag_id');let loading=false;
function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function refresh(){if(loading)return;loading=true;try{const dag=q('#dag').value,r=await fetch('/kaist-review/dags/'+encodeURIComponent(dag)+'/queue',{credentials:'same-origin'});if(!r.ok){let e=await r.json();throw Error(e.detail||'로그인 상태를 확인하세요.')}const data=await r.json();q('#cards').replaceChildren();let items=data.reviews.filter(x=>q('#done').checked||x.status!=='approved');q('#message').className='';q('#message').textContent=items.length?`검수 항목 ${items.length}개 · ${new Date().toLocaleTimeString('ko-KR')}`:'현재 검수 대기 항목이 없습니다. 계산이 끝나면 자동으로 표시됩니다.';
for(const item of items){let card=el('section',undefined,'card'),status={pending:'검수 대기',needs_approval:'재검수 필요',needs_review:'확인 필요',approved:'승인 완료',held:'보류'}[item.status]||item.status;card.append(el('span',status,'badge '+item.status),el('h2',item.label),el('b',item.episode),el('p',`${item.frames}프레임 · 4개 카메라${item.stage==='tracking'?' · 이상 후보 '+item.events+'구간':''}`));if(!item.ready)card.append(el('p',item.reason||'검수 준비가 필요합니다.','error'));let a=el('a','결과 보기 · 검수','button');a.href='/kaist-review/?'+new URLSearchParams({view:item.stage,dag_id:dag,episode:item.episode});card.append(a);q('#cards').append(card)}}catch(e){q('#message').textContent=e.message;q('#message').className='error'}finally{loading=false}}
q('#refresh').onclick=refresh;q('#dag').onchange=refresh;q('#done').onchange=refresh;refresh();setInterval(refresh,20000);
</script></html>
