<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>마스크 검수·승인</title>
<style>
body{margin:0;background:#f3f5f8;color:#18283b;font:16px/1.6 system-ui}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0}header,p{margin:8px 0 16px}.panel{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;background:#101820;border-radius:10px;overflow:hidden}figcaption{padding:8px;color:white;display:flex;justify-content:space-between}figure img{width:100%;display:block;cursor:zoom-in}label{display:inline-block;margin:4px 12px 4px 0}input,select,button,textarea{font:inherit;padding:9px;border:1px solid #bcc8d7;border-radius:7px}button{cursor:pointer;background:#fff}button.primary{background:#2563eb;color:white;border:0}button.hold{background:#a33b28;color:white;border:0}button:disabled{opacity:.45;cursor:default}input[type=range]{width:100%;padding:0}textarea{box-sizing:border-box;width:100%}#status{white-space:pre-wrap}.error{color:#ac2929}.ok{color:#087346}.legend span{padding:2px 9px;border-radius:5px}.cloth{background:#b9f3cf}.hand{background:#f7c4eb}#checks label{display:block}a{color:#1d4ed8}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><main>
<header><a href="/kaist-review/">← 검수 대기 목록</a> · <a href="/">Airflow 진행 상태</a> · <a href="/kaist-review/?view=tracking">추적 검수</a><h1>마스크 검수·승인</h1><p>실제 RGB 위에 승인 대상 초안 마스크를 표시합니다. 녹색은 천, 분홍색은 손입니다. 이미지를 클릭하면 원본 크기로 열립니다.</p></header>
<section class="panel"><label>파이프라인 <select id="dag"><option>kaist_revising_gpu_4090_a</option></select></label><label>에피소드 <input id="ep" value="ep_20260826_083803"></label><button id="load">검수 시작 / 새로 확인</button><p id="status">검수할 에피소드를 불러오세요.</p></section>
<section id="viewer" hidden>
<div class="panel"><div><b id="counter"></b> <button id="prev">← 이전</button> <button id="next">다음 →</button> <button id="play">▶ 재생</button> <button id="first">처음</button> <button id="middle">중간</button> <button id="last">마지막</button></div><input id="frame" type="range" min="0" value="0"><label>표시 <select id="mode"><option value="overlay">천 + 손 마스크</option><option value="hand">손 마스크</option><option value="object">천 마스크</option><option value="rgb">원본 RGB</option></select></label><span class="legend"><span class="cloth">천</span> <span class="hand">손</span></span></div>
<div class="grid" id="images"></div>
<div class="panel"><h2>검수 결과</h2><p>각 카메라의 처음·중간·마지막 프레임을 불러온 뒤 검수 완료를 체크할 수 있습니다. 필요한 다른 프레임도 확인하세요. 수정이 필요하면 보류하고 기존 마스크 편집기로 수정할 수 있습니다.</p><div id="checks"></div><p>검수자: <b id="reviewer"></b> (Airflow 로그인 계정으로 기록)</p><textarea id="note" rows="3" placeholder="검수 의견·보류 사유. 누락 또는 빈 마스크를 허용해 승인할 때에는 사유가 필요합니다."></textarea><p><button id="approve" class="primary" disabled>4개 카메라 검수 완료 · 승인</button> <button id="hold" class="hold">보류 · 후속 단계 대기</button></p><p id="result" role="status"></p></div>
</section></main>
<script>
const token='__CSRF_TOKEN__',q=s=>document.querySelector(s);let meta=null,path='',frame=0,visited=[new Set(),new Set(),new Set(),new Set()],timer=null,busy=false,epoch=0;
const params=new URLSearchParams(location.search);if(params.get('dag_id'))q('#dag').value=params.get('dag_id');if(params.get('episode'))q('#ep').value=params.get('episode');
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});if(!r.ok){let e=await r.json().catch(()=>({detail:r.statusText}));throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}return r.json()}
function status(text,error=false){q('#status').textContent=text;q('#status').className=error?'error':''}
function required(){return new Set([0,Math.floor(meta.frames/2),meta.frames-1])}
function checks(){for(let c=0;c<4;c++){let box=q('#check'+c);box.disabled=![...required()].every(f=>visited[c].has(f))||busy}q('#approve').disabled=busy||![0,1,2,3].every(c=>q('#check'+c).checked)}
function stop(){clearInterval(timer);timer=null;q('#play').textContent='▶ 재생'}
async function show(f){if(!meta)return;frame=Math.max(0,Math.min(meta.frames-1,Number(f)));q('#frame').value=frame;q('#counter').textContent=`프레임 ${frame+1} / ${meta.frames} (인덱스 ${frame})`;let e=++epoch,at=frame,mode=q('#mode').value;
 await Promise.all([0,1,2,3].map(c=>new Promise(resolve=>{let img=q('#im'+c),url=path+`/image?cam=${c}&frame=${at}&mode=${mode}`;img.onload=()=>{if(e===epoch&&mode==='overlay'){visited[c].add(at);checks()}resolve()};img.onerror=()=>{status('이미지 로딩 실패: 카메라 '+(c+1),true);stop();resolve()};img.src=url;img.onclick=()=>window.open(url,'_blank','noopener')})))}
q('#load').onclick=async()=>{stop();q('#viewer').hidden=true;meta=null;status('마스크와 승인 상태를 확인 중입니다…');try{path=`/kaist-review/dags/${encodeURIComponent(q('#dag').value)}/episodes/${encodeURIComponent(q('#ep').value.trim())}`;meta=await request(path);visited=[new Set(),new Set(),new Set(),new Set()];q('#images').innerHTML=[0,1,2,3].map(c=>`<figure><figcaption>Camera ${c+1}</figcaption><img id="im${c}" alt="카메라 ${c+1} RGB와 마스크"></figure>`).join('');q('#checks').innerHTML=[0,1,2,3].map(c=>`<label><input type="checkbox" id="check${c}" disabled> Camera ${c+1} 검수 완료</label>`).join('');q('#checks').onchange=checks;q('#reviewer').textContent=meta.reviewer;q('#frame').max=meta.frames-1;q('#viewer').hidden=false;q('#result').textContent='';status(`${meta.episode} · ${meta.frames}프레임 · ${meta.approval.status==='approved'?'이미 승인된 결과입니다.':'마스크 검수 대기'}`);await show(0)}catch(e){status(e.message,true)}};
q('#frame').oninput=e=>{stop();show(e.target.value)};q('#mode').onchange=()=>show(frame);q('#prev').onclick=()=>show(frame-1);q('#next').onclick=()=>show(frame+1);q('#first').onclick=()=>show(0);q('#middle').onclick=()=>show(Math.floor(meta.frames/2));q('#last').onclick=()=>show(meta.frames-1);
q('#play').onclick=async()=>{if(timer){stop();return}q('#play').textContent='❚❚ 일시정지';let loading=false;timer=setInterval(async()=>{if(loading)return;if(frame>=meta.frames-1){stop();return}loading=true;await show(frame+1);loading=false},350)};
async function decide(decision){stop();if(!meta||busy)return;if(decision==='approve'&&!confirm('4개 카메라의 마스크 검수를 완료했으며 이 결과를 승인하시겠습니까?'))return;busy=true;checks();q('#hold').disabled=true;q('#result').textContent='검증 및 기록 중입니다…';try{const result=await request(path+'/decision',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({decision,basis:meta.basis,checked:[0,1,2,3].map(c=>q('#check'+c).checked),note:q('#note').value})});q('#result').textContent=result.message;q('#result').className='ok';if(result.status==='approved'){status('승인 완료 · Airflow가 승인본을 검증한 뒤 추적으로 진행합니다.');meta=null}}catch(e){q('#result').textContent=e.message;q('#result').className='error'}finally{busy=false;q('#hold').disabled=!meta;if(meta)checks()}}
q('#approve').onclick=()=>decide('approve');q('#hold').onclick=()=>decide('hold');
</script></html>
